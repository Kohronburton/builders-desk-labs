services:
  workflow-engine:
    build: .
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      DB_PATH: /app/data/workflow-demo.sqlite
      AI_MODE: ${AI_MODE:-deterministic}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      DIAGNOSTICS_TIMEOUT_MS: ${DIAGNOSTICS_TIMEOUT_MS:-800}
      MOCK_TIMEOUT_MS: ${MOCK_TIMEOUT_MS:-1200}
    ports:
      - "3000:3000"
    volumes:
      - workflow_data:/app/data
    restart: unless-stopped

  n8n:
    image: ${N8N_IMAGE:-n8nio/n8n:latest}
    depends_on:
      workflow-engine:
        condition: service_healthy
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      GENERIC_TIMEZONE: America/New_York
      TZ: America/New_York
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
    restart: unless-stopped

volumes:
  workflow_data:
  n8n_data:
