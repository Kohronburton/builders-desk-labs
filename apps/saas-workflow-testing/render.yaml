services:
  - type: web
    name: builders-desk-flowguard-qa
    runtime: docker
    rootDir: apps/saas-workflow-testing
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: REVIEW_PROVIDER_MODE
        value: simulated-paid
      - key: AI_TIMEOUT_MS
        value: 8000
