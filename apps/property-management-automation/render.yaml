services:
  - type: web
    name: builders-desk-propertyflow-ai
    runtime: docker
    rootDir: apps/property-management-automation
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER_MODE
        value: simulated-paid
      - key: AI_TIMEOUT_MS
        value: 8000
