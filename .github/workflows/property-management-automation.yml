name: Property Management Automation Demo

on:
  push:
    paths:
      - 'apps/property-management-automation/**'
      - '.github/workflows/property-management-automation.yml'
  pull_request:
    paths:
      - 'apps/property-management-automation/**'
      - '.github/workflows/property-management-automation.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/property-management-automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: docker build -t property-management-automation .
