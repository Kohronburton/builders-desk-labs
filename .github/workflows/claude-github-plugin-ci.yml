name: Claude GitHub Plugin CI

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "tsconfig.json"
      - "Dockerfile"
      - ".github/workflows/claude-github-plugin-ci.yml"
  push:
    branches:
      - "agent/claude-github-plugin"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
