name: Mayne Foundation Quality

on:
  pull_request:
    paths:
      - "packages/**"
      - "apps/**/module.manifest.json"
      - "scripts/validate-modules.mjs"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/mayne-foundation.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm validate:modules
      - run: pnpm typecheck
      - run: pnpm test
